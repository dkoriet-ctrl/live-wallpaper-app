name: Build Live Wallpaper APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Create directories and Gradle config
        run: |
          mkdir -p app/src/main/java/com/example/livewallpaper
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/color
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LiveWallpaper"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.livewallpaper'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.livewallpaper'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Generate manifest and resources
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SET_WALLPAPER" />

              <uses-feature
                  android:name="android.software.live_wallpaper"
                  android:required="true" />
              <uses-feature
                  android:glEsVersion="0x00020000"
                  android:required="true" />

              <application
                  android:name=".App"
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LiveWallpaper">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PreviewActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:exported="false" />

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="false" />

                  <service
                      android:name=".LiveWallpaperService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/wallpaper.xml
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Live Wallpaper</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="coral">#E53935</color>
              <color name="rose">#F2B8B5</color>
              <color name="maroon">#8C1D18</color>
              <color name="rose_brown">#7A3B3D</color>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="outline_gray">#808080</color>
              <color name="thumb_off">#9E9E9E</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LiveWallpaper" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/coral</item>
                  <item name="colorOnPrimary">@color/white</item>
                  <item name="colorSurface">@color/white</item>
                  <item name="colorOnSurface">@color/black</item>
                  <item name="android:colorBackground">@color/white</item>
                  <item name="colorOnBackground">@color/black</item>
                  <item name="android:windowBackground">@color/white</item>
                  <item name="android:statusBarColor">@color/white</item>
                  <item name="android:navigationBarColor">@color/white</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-night/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LiveWallpaper" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/coral</item>
                  <item name="colorOnPrimary">@color/white</item>
                  <item name="colorSurface">@color/black</item>
                  <item name="colorOnSurface">@color/white</item>
                  <item name="android:colorBackground">@color/black</item>
                  <item name="colorOnBackground">@color/white</item>
                  <item name="android:windowBackground">@color/black</item>
                  <item name="android:statusBarColor">@color/black</item>
                  <item name="android:navigationBarColor">@color/black</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/color/switch_thumb.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:color="@color/maroon" android:state_checked="true" />
              <item android:color="@color/thumb_off" />
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/color/switch_track.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:color="@color/rose" android:state_checked="true" />
              <item android:color="#66808080" />
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/color/outline_stroke.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:color="@color/rose" android:state_focused="true" />
              <item android:color="@color/rose" android:state_activated="true" />
              <item android:color="@color/outline_gray" />
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_pill_glass.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#33FFFFFF" />
              <stroke android:width="1dp" android:color="#66FFFFFF" />
              <corners android:radius="32dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_circle_translucent.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#66000000" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#E53935"
                  android:pathData="M54,54m-40,0a40,40 0,1 1,80 0a40,40 0,1 1,-80 0" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M44,36L44,72L74,54Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_settings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_video_file.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M18,4l2,4h-3l-2,-4h-2l2,4h-3l-2,-4H8l2,4H7L5,4H4c-1.1,0 -1.99,0.9 -1.99,2L2,18c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V4h-4z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_image_file.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M21,19V5c0,-1.1 -0.9,-2 -2,-2H5c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2zM8.5,13.5l2.5,3.01L14.5,12l4.5,6H5l3.5,-4.5z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_back.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z" />
          </vector>
          EOF

      - name: Generate layouts
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="?android:attr/colorBackground"
              android:orientation="vertical">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="24dp"
                  android:paddingEnd="12dp">

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:fontFamily="sans-serif-light"
                      android:text="Live Wallpaper"
                      android:textColor="?attr/colorOnBackground"
                      android:textSize="24sp" />

                  <ImageButton
                      android:id="@+id/settingsButton"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:contentDescription="Settings"
                      android:src="@drawable/ic_settings"
                      android:tint="?attr/colorOnBackground" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:gravity="center"
                  android:orientation="vertical">

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/videoButton"
                      android:layout_width="240dp"
                      android:layout_height="60dp"
                      android:text="Video"
                      android:textAllCaps="false"
                      android:textColor="@color/white"
                      android:textSize="18sp"
                      app:backgroundTint="@color/coral"
                      app:cornerRadius="30dp"
                      app:icon="@drawable/ic_video_file"
                      app:iconGravity="textStart"
                      app:iconTint="@color/white" />

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/imageButton"
                      android:layout_width="240dp"
                      android:layout_height="60dp"
                      android:layout_marginTop="16dp"
                      android:text="Image"
                      android:textAllCaps="false"
                      android:textColor="@color/white"
                      android:textSize="18sp"
                      app:backgroundTint="@color/coral"
                      app:cornerRadius="30dp"
                      app:icon="@drawable/ic_image_file"
                      app:iconGravity="textStart"
                      app:iconTint="@color/white" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_preview.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/previewRoot"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <TextureView
                  android:id="@+id/textureView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:visibility="gone" />

              <com.example.livewallpaper.MediaCanvasView
                  android:id="@+id/canvasView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:visibility="gone" />

              <ImageButton
                  android:id="@+id/backButton"
                  android:layout_width="44dp"
                  android:layout_height="44dp"
                  android:layout_gravity="top|start"
                  android:layout_margin="12dp"
                  android:background="@drawable/bg_circle_translucent"
                  android:contentDescription="Back"
                  android:padding="10dp"
                  android:src="@drawable/ic_back"
                  android:tint="@color/white" />

              <TextView
                  android:id="@+id/setButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom|center_horizontal"
                  android:layout_marginBottom="32dp"
                  android:background="@drawable/bg_pill_glass"
                  android:clickable="true"
                  android:focusable="true"
                  android:foreground="?attr/selectableItemBackground"
                  android:gravity="center"
                  android:minHeight="56dp"
                  android:paddingStart="44dp"
                  android:paddingEnd="44dp"
                  android:text="Set Wallpaper"
                  android:textColor="@color/white"
                  android:textSize="17sp" />
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_settings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http:
